services:

  # 数据库管理
  adminer:
    image: adminer:4
    volumes:
      - ./adminer/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
    ports:
      - ${DB_ADMINER_PORT}:8080
    environment: 
      - ADMINER_PLUGINS=tables-filter tinymce json-column
    depends_on: 
      - db


  # php-fpm
  php-fpm:
    build: ./php-fpm
    image: docker-magento2-php-fpm
    depends_on:
      - db
      - redis
      - elasticsearch
    volumes:
      - ${APPLICATION}:/var/www/html:cached
      - ./php-fpm/php.ini:/usr/local/etc/php/php.ini
      - ./php-fpm/www.conf:/usr/local/etc/php-fpm.d/www.conf

  # cron
  cron:
    build: ./cron
    image: docker-magento2-cron
    depends_on:
      - php-fpm
    restart: ${CONTAINER_RESTART}
    volumes:
      - ${APPLICATION}:/var/www/html:cached
    tty: true

  # php-composer，安装组键、发布到服务器等操作
  workspace:
    build: ./workspace
    image: docker-magento2-workspace
    user: www-data
    working_dir: /var/www/html
    depends_on:
      - php-fpm
    volumes:
      - workspace-home:/var/www
      - ./:/var/www/.docker/
      - ${APPLICATION}:/var/www/html:cached
    ports:
      - ${WORKSPACE_SSH_PORT}:22
      - ${WORKSPACE_CODER_PORT}:8080
    tty: true
    

  # nginx
  nginx:
    image: nginx
    depends_on:
      - php-fpm
    volumes:
      - ${APPLICATION}:/var/www/html:cached
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "${NGINX_HOST_HTTP_PORT}:80"

  # redis
  redis:
    #build: ./redis
    image: redis:5
    restart: ${CONTAINER_RESTART}
    volumes:
      - ./redis/redis.conf:/data/redis.conf
    command: redis-server /data/redis.conf

  varnish:
    image: varnish:6.6
    depends_on:
      - nginx
      - cron
      - workspace
    volumes:
      - ./varnish/default.vcl:/etc/varnish/default.vcl:ro
    tmpfs:
      - /var/lib/varnish:exec
    environment: 
      - VARNISH_SIZE
    ports:
      - "${VARNISH_PORT}:80"

  db:
    image: mysql:5.7
    restart: ${CONTAINER_RESTART}
    volumes:
      - ${DB_DIR}:/var/lib/mysql
      - ./db/initdb.d/:/docker-entrypoint-initdb.d
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_USER=${DB_USER}
      - MYSQL_DATABASE=${DB_NAME}

volumes:
  workspace-home:
